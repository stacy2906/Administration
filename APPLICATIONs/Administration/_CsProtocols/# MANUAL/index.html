<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8">
<title>Индекс Документации Проекта</title>
<style>
body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 30px; background-color: #e9ecef; color: #333; }
.container { max-width: 950px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
h1 { color: #0066FF; margin-top: 0; }
.class-card { background: #f8f9fa; border-left: 5px solid #0066FF; margin: 12px 0; padding: 15px; border-radius: 0 6px 6px 0; }
.class-card h3 { margin: 0 0 6px 0; }
.class-card a { color: #0066FF; text-decoration: none; font-size: 18px; }
.class-card a:hover { text-decoration: underline; }
.notes-section { margin-top: 40px; padding-top: 20px; border-top: 2px solid #dee2e6; }
textarea { width: 100%; height: 90px; margin: 10px 0; padding: 10px; border: 1px solid #ced4da; border-radius: 5px; box-sizing: border-box; }
button { padding: 10px 20px; background: #0066FF; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
button:hover { background: #0052cc; }
.note-item { background: #fff3cd; border-left: 4px solid #ffc107; padding: 10px; margin-top: 8px; border-radius: 4px; }
</style></head><body>
<div class="container">
<h1>Документация Проекта</h1>
<p>Всего задокументировано классов: <strong>2</strong></p>
<div class="class-card">
<h3><a href="cspAreaGrid.html">Класс cspAreaGrid</a></h3>
<p>Класс табличной области</p>
</div>
<div class="class-card">
<h3><a href="cspApplication.html">Класс cspApplication</a></h3>
<p>Класс приложения 'CsProtocols'</p>
</div>
<div class="notes-section">
<h2>Заметки и Комментарии к проекту</h2>
<div id="notesContainer"></div>
<textarea id="noteInput" placeholder="Введите ваши замечания..."></textarea>
<button onclick="addNote()">Сохранить заметку</button>
</div>
<script>
function addNote() {
    var text = document.getElementById('noteInput').value;
    if(text.trim() !== '') {
        var div = document.createElement('div');
        div.className = 'note-item';
        div.innerHTML = '<strong>' + new Date().toLocaleString() + ':</strong> ' + text;
        document.getElementById('notesContainer').appendChild(div);
        document.getElementById('noteInput').value = '';
    }
}
</script>
</div></body></html>
